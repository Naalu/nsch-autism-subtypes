[project]
name = "nsch-autism-subtypes"
version = "0.1.0"
description = "Do autistic children fall into distinct subtypes? Latent class and hierarchical clustering of co-occurring conditions in the National Survey of Children's Health, 2016-2025."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Chris Reger" },
    { name = "Haley Berger" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "stepmix>=3.0,<4",  # results were produced with 3.0; get_parameters() layout is version-specific
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Alternative loader that reads the survey through the NAU-ASD3 nsch package.
nsch = ["nsch @ git+https://github.com/NAU-ASD3/nsch-py"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nsch_subtypes"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["slow: runs the pipeline scripts end to end (about 5 minutes); run with -m slow"]
addopts = "-m 'not slow'"
